<!-- TOP NAVBAR -->
<div class="topbar">
  <!-- Left Side: Logo -->
  <div class="topbar-left">
    {% if user.is_authenticated %}
    <button class="hamburger-menu-btn" onclick="toggleSidebar(event)" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; margin-right: 15px; padding: 5px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    {% endif %}
    <a href="{% url 'home' %}" class="topbar-logo">VehicleVault</a>
  </div>

  <!-- Center/Right: Main Menu -->
  <div class="topbar-menu">
    <a href="{% url 'home' %}">Home</a>
    {% if user.is_authenticated and user.is_superuser %}
    <a href="{% url 'manage_brands' %}">Brands</a>
    <a href="/admin/" target="_blank">Admin Panel</a>
    {% else %}
    <a href="{% url 'search_cars' %}">Search Cars</a>
    <a href="{% url 'compare_cars' %}">Compare Cars</a>
    <a href="{% url 'brands' %}">Brands</a>
    {% endif %}
    <a href="{% if user.is_authenticated %}{% if user.is_superuser %}{% url 'admin_dashboard' %}{% else %}{% url 'user_dashboard' %}{% endif %}{% else %}{% url 'login' %}{% endif %}">Dashboard</a>
  </div>

  <!-- Right Side: User Actions -->
  <div class="topbar-right">
    {% if user.is_authenticated %}
    <div class="profile-dropdown-container">
      <button class="profile-icon-btn" onclick="toggleProfileDropdown(event)">
        {% if user.profile_picture %}
        <div
          class="profile-avatar"
          style="background-image: url('{{ user.profile_picture.url }}'); background-size: cover; background-position: center; border-radius: 50%; border: 2px solid white;"
        ></div>
        {% else %}
        <div class="profile-avatar">
          {{ user.email|make_list|first|upper }}
        </div>
        {% endif %}
      </button>

      <!-- Dropdown Content -->
      <div class="profile-dropdown-menu" id="profileDropdown">
        <div class="dropdown-links">
          <a href="{% url 'my_account' %}">
            <span class="dropdown-icon">⚙️</span> Profile
            <span class="dropdown-chevron">&rsaquo;</span>
          </a>
        </div>
        <div class="dropdown-footer">
          <a href="{% url 'logout' %}" class="dropdown-logout-btn">Logout</a>
        </div>
      </div>
    </div>

    <!-- Script to handle clicking outside dropdown -->
    <script>
      function toggleSidebar(event) {
        if (event) event.stopPropagation();
        
        const sidebars = document.querySelectorAll(".admin-sidebar, .uv-sidebar, .user-sidebar, .sidebar");
        const overlays = document.querySelectorAll(".sidebar-overlay");
        
        sidebars.forEach(sidebar => sidebar.classList.toggle("active"));
        overlays.forEach(overlay => overlay.classList.toggle("active"));
      }

      function toggleProfileDropdown(event) {
        event.stopPropagation();
        const dropdown = document.getElementById("profileDropdown");
        dropdown.classList.toggle("show");
      }

      window.addEventListener("click", function (e) {
        const profileDropdown = document.getElementById("profileDropdown");
        const profileBtn = document.querySelector(".profile-icon-btn");
        if (profileDropdown && profileDropdown.classList.contains("show")) {
          if (!profileDropdown.contains(e.target) && (!profileBtn || !profileBtn.contains(e.target))) {
            profileDropdown.classList.remove("show");
          }
        }
        
        // Code to click outside sidebar to close it on mobile could go here if needed
      });
    </script>

    {% else %}
    <a href="{% url 'login' %}" class="topbar-link">Login</a>
    <a href="{% url 'signup' %}" class="btn-topbar btn-signup">Signup</a>
    {% endif %}
  </div>
</div>
