{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>{% block title %}My App{% endblock %}</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="{% static 'css/base_styles.css' %}?v=2" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=7" />

    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Page Specific CSS -->
    {% block css %} {% endblock %}
  </head>

  <body>
    <!-- Entire Dashboard Layout Wrapper -->
    <div class="dashboard">
      <!-- Main Content Area -->
      <div class="main">
        <!-- Top Navbar Component -->
        {% include 'core/topnavbar.html' %}

        <!-- Actual Page Content -->
        <div class="content">{% block content %} {% endblock %}</div>

        <!-- Footer Component -->
        {% include 'core/footer.html' %}
      </div>
    </div>

    <!-- Back to Top Button -->
    <button id="vvBackToTop" title="Go to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>

    <style>
      #vvBackToTop {
        display: flex; /* overridden by flex but let's manage visibility using pointer-events or opacity */
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        width: 50px;
        height: 50px;
        border: none;
        outline: none;
        background: linear-gradient(135deg, #3B82F6, #1E293B);
        color: white;
        cursor: pointer;
        border-radius: 50%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px) scale(0.9);
        align-items: center;
        justify-content: center;
      }
      #vvBackToTop.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }
      #vvBackToTop:hover {
        background: linear-gradient(135deg, #2563EB, #0F172A);
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      }
      
      /* Dark mode override */
      body.dark-mode #vvBackToTop {
        background: linear-gradient(135deg, #1E293B, #0F172A);
        border: 1px solid #334155;
      }
      body.dark-mode #vvBackToTop:hover {
        background: #0F172A;
        border-color: #3B82F6;
      }
    </style>

    <script>
      // Back to Top Logic
      const bttBtn = document.getElementById("vvBackToTop");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          bttBtn.classList.add("show");
        } else {
          bttBtn.classList.remove("show");
        }
      });
      bttBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    </script>
  </body>
</html>
